name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klyz
          POSTGRES_PASSWORD: klyz
          POSTGRES_DB: klyz_integrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klyz -d klyz_integrations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # The test harness clones one database per test file from this
      # admin URL; it is never the application database.
      KLYZ_TEST_DATABASE_URL: postgres://klyz:klyz@127.0.0.1:5432/postgres
      KLYZ_PG_URL: postgres://klyz:klyz@127.0.0.1:5432/klyz_integrations

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same step `npm run infra:up` runs locally, against the service
      # container: proves the app database is created on demand.
      - run: node scripts/ensure-app-db.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
